<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="../css/reset.css"
    />
    <link
      rel="stylesheet"
      href="../css/custom-checkbox.css"
    />
    <title>Custom Checkbox</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="title">
          <span></span>
          <span> Checkbox </span>
          <span> Radio </span>
          <span> Switch </span>
        </div>
        <div class="btn-on">
          <span>On</span>

          <label class="action-btn btn-square">
            <input
              type="checkbox"
              hidden
              checked
            />
          </label>

          <label class="action-btn btn-circle">
            <input
              type="radio"
              name="radio-on"
              hidden
              checked
            />
          </label>

          <label class="action-btn btn-round">
            <input
              type="checkbox"
              hidden
              checked
            />
          </label>
        </div>
        <div class="btn-off">
          <span>Off</span>

          <label class="action-btn btn-square">
            <input
              type="checkbox"
              hidden
            />
          </label>

          <label class="action-btn btn-circle">
            <input
              type="radio"
              name="radio-off"
              hidden
            />
          </label>

          <label class="action-btn btn-round">
            <input
              type="checkbox"
              hidden
            />
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
