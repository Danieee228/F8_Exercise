<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Slide</title>
    <link
      rel="stylesheet"
      href="../css/slide.css"
    />
  </head>
  <body>
    <div class="slideshow-container">
      <div class="slideshow-track js-track">
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1777465492748-f2eceaef8e55?q=80&w=1175&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 1"
          />
        </div>
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1779449607497-d000096e3324?q=80&w=1168&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 2"
          />
        </div>
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1779393431101-888294788324?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 3"
          />
        </div>
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1779287043213-9eae051828ad?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 4"
          />
        </div>
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1778808351776-a47c03331bf3?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 5"
          />
        </div>
        <div class="slide-item js-slide">
          <img
            src="https://images.unsplash.com/photo-1778880509934-0ab4843d9ed2?q=80&w=803&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Slide 6"
          />
        </div>
      </div>

      <button class="nav-btn prev-btn js-prev-btn">&lt; Prev</button>
      <button class="nav-btn next-btn js-next-btn">Next &gt;</button>
      <div class="pagination js-pagination"></div>
    </div>
    <script src="../js/slide.js"></script>
  </body>
</html>
